<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>KGTF ENGINE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=16">
<script>
    if (window.location.search.includes("reset")) { localStorage.clear(); window.location.href = window.location.pathname; }
</script>
</head>
<body>
    <!-- الشريط العلوي الاحترافي -->
    <header id="top-bar">
        <div class="logo">KGTF <span>ENGINE</span></div>
        <div class="toolbar-group">
            <button class="tool-btn active" id="btn-gizmo-translate" title="تحريك">✥</button>
            <button class="tool-btn" id="btn-gizmo-rotate" title="تدوير">↻</button>
            <button class="tool-btn" id="btn-gizmo-scale" title="تكبير">⤢</button>
        </div>
        <div class="toolbar-group">
            <button class="tool-btn" id="btn-toggle-grid" title="الشبكة">▦</button>
            <button class="tool-btn" id="btn-focus" title="تركيز">🎯</button>
        </div>
        <div class="play-controls">
            <button class="btn-save" id="btn-save">حفظ 💾</button>
            <button class="btn-play" id="btn-play">▶ تشغيل</button>
        </div>
    </header>

    <div id="main-workspace">
        <!-- شريط الأدوات الأيسر (إضافة المجسمات) -->
        <aside id="left-toolbar">
            <button class="tool-btn" id="btn-cube" title="مكعب">📦</button>
            <button class="tool-btn" id="btn-sphere" title="كرة">🔴</button>
            <button class="tool-btn" id="btn-cylinder" title="أسطوانة">🛢️</button>
            <button class="tool-btn" id="btn-tree" title="شجرة">🌲</button>
            <button class="tool-btn" id="btn-rock" title="صخرة">🪨</button>
            <button class="tool-btn" id="btn-light" title="ضوء">💡</button>
            <button class="tool-btn" id="btn-character" title="شخصية">🏃</button>
            <button class="tool-btn" id="btn-camera" title="كاميرا">📷</button>
            <div style="width: 100%; height: 1px; background: #333; margin: 5px 0;"></div>
            <button class="tool-btn" id="btn-upload-model" title="رفع مجسم">📁</button>
            <input type="file" id="model-upload-input" accept=".glb,.gltf" style="display:none;">
        </aside>

        <!-- مساحة العرض (Viewport) -->
        <main id="viewport-container">
            <canvas id="viewport"></canvas>
            <div id="status-bar">FPS: <span id="fps">--</span></div>
            
            <!-- واجهة اللعب -->
            <div id="play-ui" style="display:none;">
                <button id="exit-play">✕ خروج</button>
                <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
                <button id="btn-jump">⬆ قفز</button>
            </div>
        </main>

        <!-- لوحة الخصائص (Inspector) -->
        <aside id="right-panel">
            <div id="panel-tabs">
                <button class="tab-btn active" data-target="tab-outliner">Hierarchy</button>
                <button class="tab-btn" data-target="tab-details">Inspector</button>
            </div>
            
            <div class="panel-content-wrapper">
                <div class="panel-section tab-pane active" id="tab-outliner">
                    <div class="panel-header">
                        <span class="panel-title">SCENE OBJECTS</span>
                        <button class="btn-small" id="btn-clear-scene">مسح</button>
                    </div>
                    <div id="object-list"></div>
                </div>
                
                <div class="panel-section tab-pane" id="tab-details">
                    <div class="panel-header">
                        <span class="panel-title">PROPERTIES</span>
                        <div id="object-actions" style="display:none;">
                            <button class="btn-small" id="btn-delete">حذف</button>
                        </div>
                    </div>
                    <div id="no-selection-msg">لم يتم تحديد مجسم.</div>
                    <div id="inspector" style="display:none;">
                        <div class="prop-group">
                            <div class="prop-row"><label>اللون</label><input type="color" id="prop-color" value="#00e5ff"></div>
                            <div class="prop-row"><label>X</label><input type="range" id="prop-x" min="-20" max="20" step="0.1" value="0"></div>
                            <div class="prop-row"><label>Y</label><input type="range" id="prop-y" min="-5" max="15" step="0.1" value="0.5"></div>
                            <div class="prop-row"><label>Z</label><input type="range" id="prop-z" min="-20" max="20" step="0.1" value="0"></div>
                            <div class="prop-row"><label>دوران</label><input type="range" id="prop-rot-y" min="0" max="6.28" step="0.1" value="0"></div>
                            <div class="prop-row"><label>حجم</label><input type="range" id="prop-scale" min="0.1" max="4" step="0.1" value="1"></div>
                        </div>
                        <div class="prop-group">
                            <div class="panel-title">PHYSICS</div>
                            <div class="prop-row"><label>جاذبية</label><input type="checkbox" id="prop-physics"></div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>
    
    <audio id="bgm" loop src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3"></audio>
    <audio id="jump-sfx" src="https://assets.mixkit.co/active_storage/sfx/224/224-preview.mp3"></audio>

    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module" src="src/main.js?v=86"></script>
</body>
</html>
