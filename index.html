<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KGTF ENGINE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3.0.0">
</head>
<body>
    <header id="header">
        <div class="header-tools">
            <div class="tool-group">
                <button class="icon-btn active" id="btn-gizmo-translate" title="تحريك">✥</button>
                <button class="icon-btn" id="btn-gizmo-rotate" title="تدوير">↻</button>
                <button class="icon-btn" id="btn-gizmo-scale" title="تكبير">⤢</button>
            </div>
            
            <div class="dropdown">
                <button class="icon-btn" id="btn-add-menu" style="color:#4ade80;" title="إضافة">➕</button>
                <div class="dropdown-content" id="add-menu">
                    <button class="add-btn" data-type="cube">📦 مكعب</button>
                    <button class="add-btn" data-type="sphere">🔴 كرة</button>
                    <button class="add-btn" data-type="tree">🌲 شجرة</button>
                    <button class="add-btn" data-type="character">🏃 شخصية</button>
                    <button class="add-btn" data-type="light">💡 ضوء</button>
                    <button class="add-btn" data-type="vfx-fire" style="color:#ffaa00;">🔥 نار</button>
                    <button class="add-btn" data-type="vfx-smoke" style="color:#aaa;">☁️ دخان</button>
                </div>
            </div>

            <div class="tool-group">
                <button class="icon-btn" id="btn-save" title="حفظ">💾</button>
                <button class="icon-btn" id="btn-export" title="تصدير">📤</button>
                <button class="icon-btn" id="btn-import" title="استيراد">📥</button>
                <input type="file" id="file-import" accept=".json" style="display:none;">
            </div>

            <button class="play-btn" id="btn-play" title="تشغيل">▶</button>
        </div>
    </header>

    <main id="viewport-container">
        <canvas id="viewport"></canvas>
        <div id="status-bar">FPS: <span id="fps">--</span></div>
        
        <div id="play-ui">
            <div id="score-display" style="display:none;">النقاط: <span id="score-val">0</span></div>
            <button id="exit-play">✕ إيقاف</button>
            <div id="joystick-zone"><div id="joystick-knob"></div></div>
            <button id="btn-jump">قفز</button>
            <div id="custom-hud"></div>
        </div>
    </main>

    <aside id="inspector-panel">
        <div id="panel-tabs">
            <button class="tab-btn active" data-target="tab-outliner">Outliner</button>
            <button class="tab-btn" data-target="tab-details">Details</button>
            <button class="tab-btn" data-target="tab-world">World</button>
            <button class="tab-btn" data-target="tab-ui">UI</button>
            <button class="tab-btn" data-target="tab-logic">Logic</button>
            <button class="tab-btn" data-target="tab-assets">Assets</button>
        </div>
        <div class="panel-content-wrapper">
            <div class="panel-section tab-pane active" id="tab-outliner">
                <div class="panel-header">
                    <span class="panel-title">OUTLINER</span>
                    <button class="btn-small" id="btn-clear-scene" style="color:#ff5577;">مسح الكل</button>
                </div>
                <div id="object-list"></div>
            </div>
            
            <div class="panel-section tab-pane" id="tab-details">
                <div class="panel-header"><span class="panel-title" style="color:#00e5ff;">DETAILS</span></div>
                <div id="no-selection-msg" style="text-align:center; color:#666; font-size:12px; margin-top:10px;">لم يتم تحديد مجسم.</div>
                <div id="inspector">
                    <div class="prop-grid">
                        <div class="prop-row"><label>X</label><input type="range" id="prop-x" min="-50" max="50" step="0.1"></div>
                        <div class="prop-row"><label>Y</label><input type="range" id="prop-y" min="-5" max="30" step="0.1"></div>
                        <div class="prop-row"><label>Z</label><input type="range" id="prop-z" min="-50" max="50" step="0.1"></div>
                        <div class="prop-row"><label>🎨</label><input type="color" id="prop-color" value="#00e5ff"></div>
                        <div class="prop-row" style="grid-column: span 2; justify-content: space-between; background: #222; margin-top: 5px;">
                            <label style="width:auto; font-weight:bold; color:#ffaa00;">تفعيل الجاذبية</label>
                            <input type="checkbox" id="prop-physics" style="width:20px; height:20px; accent-color:#ffaa00;">
                        </div>
                        <button class="btn-small" id="btn-save-asset" style="grid-column: span 2; background: #ffaa00; color: #000; font-weight: bold; margin-top: 5px;">💾 حفظ كأصل في المكتبة</button>
                    </div>
                </div>
            </div>

            <div class="panel-section tab-pane" id="tab-world">
                <div class="panel-header"><span class="panel-title">WORLD</span></div>
                <div style="padding:10px;">
                    <div class="prop-row" style="margin-bottom:10px;"><label style="width:80px;">الوضع الليلي</label><input type="checkbox" id="env-night-mode"></div>
                    <div class="prop-row"><label style="width:80px;">المطر</label><input type="checkbox" id="env-rain-toggle"></div>
                </div>
            </div>

            <div class="panel-section tab-pane" id="tab-ui">
                <div class="panel-header"><span class="panel-title" style="color:#ffaa00;">UI / HUD EDITOR</span></div>
                <div style="padding:10px;">
                    <div class="prop-row" style="margin-bottom:10px;">
                        <input type="text" id="ui-text-input" placeholder="اكتب نصاً..." style="flex:1; padding:6px; background:#222; border:1px solid #444; color:#fff; border-radius:4px;">
                    </div>
                    <button class="btn-small" id="btn-add-text" style="width:100%; background:#3b82f6; color:#fff; padding:8px;">إضافة نص للشاشة</button>
                    <button class="btn-small" id="btn-clear-ui" style="width:100%; background:#ff5577; color:#fff; padding:8px; margin-top:5px;">مسح النصوص</button>
                </div>
            </div>

            <div class="panel-section tab-pane" id="tab-logic">
                <div class="panel-header"><span class="panel-title" style="color:#4ade80;">LOGIC</span></div>
                <div style="padding:10px;">
                    <div id="no-logic-selection" style="text-align:center; color:#666; font-size:12px; margin-top:10px;">حدد مجسماً لإضافة منطق.</div>
                    <div id="logic-editor" style="display:none;">
                        <div class="prop-row" style="margin-bottom:5px;"><label style="width:50px; font-size:12px;">الحدث</label>
                            <select id="logic-event" style="flex:1; background:#222; color:#fff; border:1px solid #444; padding:4px;">
                                <option value="onStart">عند بدء اللعبة</option>
                                <option value="onCollide">عند الاصطدام باللاعب</option>
                            </select>
                        </div>
                        <div class="prop-row" style="margin-bottom:10px;"><label style="width:50px; font-size:12px;">الإجراء</label>
                            <select id="logic-action" style="flex:1; background:#222; color:#fff; border:1px solid #444; padding:4px;">
                                <option value="addScore">إضافة نقاط +10</option>
                                <option value="destroy">تدمير المجسم</option>
                                <option value="playSound">تشغيل صوت</option>
                            </select>
                        </div>
                        <button class="btn-small" id="btn-add-logic" style="width:100%; background:#4ade80; color:#000; font-weight:bold;">إضافة المنطق</button>
                        <div id="active-logic-list" style="margin-top:10px; display:flex; flex-direction:column; gap:5px;"></div>
                    </div>
                </div>
            </div>

            <div class="panel-section tab-pane" id="tab-assets">
                <div class="panel-header"><span class="panel-title" style="color:#ffaa00;">ASSETS LIBRARY</span></div>
                <div id="asset-grid" style="padding:10px; display:grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap:10px; overflow-y:auto;"></div>
            </div>
        </div>
    </aside>

    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module" src="src/main.js?v=3.0.0"></script>
</body>
</html>
