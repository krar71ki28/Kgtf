<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KGTF ENGINE</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, sans-serif; background: #0a0a0f; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    /* التصميم العلوي */
    #header { height: 50px; background: #141420; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; padding: 0 10px; gap: 10px; z-index: 10; flex-shrink: 0; }
    .logo { color: #00e5ff; font-weight: 900; letter-spacing: 1px; font-size: 14px; }
    .btn { background: #2a2a3a; color: #ccc; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #3a3a4a; color: #fff; }
    .btn.primary { background: #00e5ff; color: #000; }
    
    /* تقسيم الشاشة */
    #workspace { flex: 1; display: flex; overflow: hidden; }
    
    /* القائمة الجانبية (الملفات) */
    #left-panel { width: 70px; background: #141420; border-left: 1px solid #2a2a3a; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 10px; z-index: 10; }
    .icon-btn { width: 50px; height: 50px; background: #1e1e30; border: 1px solid #2a2a3a; border-radius: 8px; color: #fff; font-size: 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; gap: 4px; }
    .icon-btn span { font-size: 18px; }
    .icon-btn:hover { border-color: #00e5ff; color: #00e5ff; }

    /* منطقة العرض 3D */
    #viewport-container { flex: 1; position: relative; background: #000; }
    #viewport { width: 100%; height: 100%; display: block; }

    /* لوحة الخصائص (Inspector) */
    #right-panel { width: 250px; background: #141420; border-right: 1px solid #2a2a3a; display: flex; flex-direction: column; z-index: 10; overflow-y: auto; }
    .panel-section { border-bottom: 1px solid #2a2a3a; padding: 10px; }
    .panel-title { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px; }
    .prop-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .prop-row label { font-size: 12px; color: #aaa; width: 40px; }
    .prop-row input[type="range"] { flex: 1; margin: 0 10px; }
    .prop-row input[type="color"] { width: 30px; height: 30px; border: none; background: none; cursor: pointer; }
    
    /* شريط الحالة */
    #status-bar { position: absolute; bottom: 10px; left: 10px; background: rgba(20,20,30,0.8); padding: 5px 10px; border-radius: 4px; font-size: 10px; font-family: monospace; color: #0f0; z-index: 5; border: 1px solid #2a2a3a; }

    /* المساعد الذكي */
    #ai-fab { position: absolute; bottom: 20px; right: 270px; width: 50px; height: 50px; background: #ff5577; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,85,119,0.5); z-index: 20; transition: transform 0.2s; }
    #ai-fab:hover { transform: scale(1.1); }
    #ai-chat { position: absolute; bottom: 80px; right: 270px; width: 300px; height: 400px; background: #141420; border: 1px solid #ff5577; border-radius: 12px; display: none; flex-direction: column; z-index: 20; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .ai-header { padding: 10px; background: #1e1e30; color: #ff5577; font-weight: bold; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
    .ai-messages { flex: 1; padding: 10px; overflow-y: auto; font-size: 12px; line-height: 1.5; color: #ddd; }
    .ai-input-row { padding: 10px; border-top: 1px solid #2a2a3a; display: flex; gap: 5px; }
    .ai-input-row input { flex: 1; background: #0a0a0f; border: 1px solid #2a2a3a; color: #fff; padding: 8px; border-radius: 4px; outline: none; }
    .ai-input-row button { background: #ff5577; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }

    /* تجاوب مع الموبايل */
    @media (max-width: 768px) {
        #workspace { flex-direction: column; }
        #left-panel { width: 100%; height: 60px; flex-direction: row; justify-content: space-around; border-left: none; border-bottom: 1px solid #2a2a3a; }
        #right-panel { width: 100%; height: 250px; border-right: none; border-top: 1px solid #2a2a3a; }
        #viewport-container { flex: 1; }
        #ai-fab { right: 20px; bottom: 270px; }
        #ai-chat { right: 20px; bottom: 330px; width: calc(100% - 40px); height: 300px; }
    }
</style>
</head>
<body>
    <div id="header">
        <div class="logo">KGTF ENGINE</div>
        <div style="flex:1"></div>
        <button class="btn" id="btn-save">حفظ</button>
        <button class="btn primary" id="btn-play">▶ تشغيل</button>
    </div>

    <div id="workspace">
        <!-- أدوات جانبية -->
        <div id="left-panel">
            <button class="icon-btn" id="btn-cube"><span>📦</span>مكعب</button>
            <button class="icon-btn" id="btn-sphere"><span>🔴</span>كرة</button>
            <button class="icon-btn" id="btn-light"><span>💡</span>ضوء</button>
            <button class="icon-btn" id="btn-character"><span>🏃</span>شخصية</button>
        </div>

        <!-- شاشة العرض -->
        <div id="viewport-container">
            <canvas id="viewport"></canvas>
            <div id="status-bar">FPS: <span id="fps">--</span></div>
            
            <!-- المساعد الذكي -->
            <div id="ai-fab">🤖</div>
            <div id="ai-chat">
                <div class="ai-header"><span>KGTF AI Assistant</span><span id="close-ai" style="cursor:pointer;">✕</span></div>
                <div class="ai-messages" id="ai-messages">مرحباً! أنا مساعدك. اطلب مني كود Three.js (مثلاً: "اكتب لي كود مكعب يدور ويتغير لونه").</div>
                <div class="ai-input-row">
                    <input type="text" id="ai-input" placeholder="اطلب كود..." />
                    <button id="ai-send">إرسال</button>
                </div>
            </div>
        </div>

        <!-- لوحة الخصائص -->
        <div id="right-panel">
            <div class="panel-section">
                <div class="panel-title">HIERARCHY</div>
                <div id="object-list" style="font-size:12px; color:#aaa; max-height:100px; overflow-y:auto;"></div>
            </div>
            
            <div class="panel-section" id="inspector" style="display:none;">
                <div class="panel-title">PROPERTIES</div>
                
                <div class="prop-row"><label>اللون</label><input type="color" id="prop-color" value="#00e5ff"></div>
                
                <div class="prop-row"><label>X</label><input type="range" id="prop-x" min="-10" max="10" step="0.1" value="0"></div>
                <div class="prop-row"><label>Y</label><input type="range" id="prop-y" min="-10" max="10" step="0.1" value="0"></div>
                <div class="prop-row"><label>Z</label><input type="range" id="prop-z" min="-10" max="10" step="0.1" value="0"></div>
                
                <div class="prop-row"><label>دوران</label><input type="range" id="prop-rot" min="0" max="6.28" step="0.1" value="0"></div>
                <div class="prop-row"><label>حجم</label><input type="range" id="prop-scale" min="0.1" max="3" step="0.1" value="1"></div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. إعداد المشهد
        const canvas = document.getElementById('viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        scene.fog = new THREE.Fog(0x0a0a0f, 10, 50);

        const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
        camera.position.set(5, 5, 5);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1, 0);

        // 2. الإضاءة والشبكة
        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);
        scene.add(new THREE.GridHelper(50, 50, 0x2a2a3a, 0x1a1a2e));

        // 3. إدارة الكائنات
        let objects = [];
        let selected = null;
        let idCounter = 1;

        function addObject(type) {
            const mat = new THREE.MeshStandardMaterial({ color: 0x00e5ff, roughness: 0.4 });
            let mesh;
            if (type === 'cube') mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
            else if (type === 'sphere') mesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), mat);
            else if (type === 'light') {
                mesh = new THREE.PointLight(0xffaa00, 2, 10);
                mesh.position.y = 2;
            }
            
            if (mesh.isMesh) {
                mesh.position.y = 0.5;
                mesh.castShadow = true;
            }
            
            mesh.userData = { id: 'obj_' + idCounter++, type: type };
            scene.add(mesh);
            objects.push(mesh);
            selectObject(mesh);
            updateList();
        }

        function selectObject(mesh) {
            selected = mesh;
            const insp = document.getElementById('inspector');
            if (!mesh) { insp.style.display = 'none'; return; }
            insp.style.display = 'block';

            // تحديث القيم
            if (mesh.isMesh) document.getElementById('prop-color').value = '#' + mesh.material.color.getHexString();
            document.getElementById('prop-x').value = mesh.position.x;
            document.getElementById('prop-y').value = mesh.position.y;
            document.getElementById('prop-z').value = mesh.position.z;
            document.getElementById('prop-rot').value = mesh.rotation.y;
            document.getElementById('prop-scale').value = mesh.scale.x;
        }

        function updateList() {
            const list = document.getElementById('object-list');
            list.innerHTML = '';
            objects.forEach(o => {
                const div = document.createElement('div');
                div.innerText = o.userData.type + ' (' + o.userData.id + ')';
                div.style.cursor = 'pointer';
                div.style.padding = '4px';
                div.onclick = () => selectObject(o);
                list.appendChild(div);
            });
        }

        // 4. ربط أزرار الإضافة
        document.getElementById('btn-cube').onclick = () => addObject('cube');
        document.getElementById('btn-sphere').onclick = () => addObject('sphere');
        document.getElementById('btn-light').onclick = () => addObject('light');
        
        // 5. تحميل الشخصية (أنيميشن)
        document.getElementById('btn-character').onclick = () => {
            const loader = new GLTFLoader();
            // تحميل نموذج روبوت جاهز من Three.js
            loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb', (gltf) => {
                const model = gltf.scene;
                model.position.y = 0;
                model.scale.set(0.5, 0.5, 0.5);
                model.traverse(o => { if(o.isMesh) o.castShadow = true; });
                
                // إضافة أنيميشن
                const mixer = new THREE.AnimationMixer(model);
                if (gltf.animations.length > 0) {
                    const action = mixer.clipAction(gltf.animations[0]); // حركة المشي
                    action.play();
                }
                model.userData = { id: 'char_' + idCounter++, type: 'character', mixer: mixer };
                
                scene.add(model);
                objects.push(model);
                selectObject(model);
                updateList();
            });
        };

        // 6. ربط لوحة الخصائص
        document.getElementById('prop-color').oninput = (e) => { if(selected && selected.isMesh) selected.material.color.set(e.target.value); };
        document.getElementById('prop-x').oninput = (e) => { if(selected) selected.position.x = parseFloat(e.target.value); };
        document.getElementById('prop-y').oninput = (e) => { if(selected) selected.position.y = parseFloat(e.target.value); };
        document.getElementById('prop-z').oninput = (e) => { if(selected) selected.position.z = parseFloat(e.target.value); };
        document.getElementById('prop-rot').oninput = (e) => { if(selected) selected.rotation.y = parseFloat(e.target.value); };
        document.getElementById('prop-scale').oninput = (e) => { if(selected) selected.scale.setScalar(parseFloat(e.target.value)); };

        // 7. الحفظ
        document.getElementById('btn-save').onclick = () => {
            alert('تم الحفظ (في الذاكرة). إعادة التحميل ستسترجع المشهد.');
        };

        // 8. المساعد الذكي (اتصال بـ Pollinations)
        const aiFab = document.getElementById('ai-fab');
        const aiChat = document.getElementById('ai-chat');
        const aiInput = document.getElementById('ai-input');
        const aiMsgs = document.getElementById('ai-messages');

        aiFab.onclick = () => { aiChat.style.display = aiChat.style.display === 'flex' ? 'none' : 'flex'; };
        document.getElementById('close-ai').onclick = () => { aiChat.style.display = 'none'; };

        document.getElementById('ai-send').onclick = async () => {
            const text = aiInput.value.trim();
            if (!text) return;
            aiInput.value = '';
            aiMsgs.innerHTML += `<div style="color:#ff5577; margin-bottom:5px;">👤 ${text}</div>`;
            aiMsgs.innerHTML += `<div id="ai-loading" style="color:#888;">جاري التفكير...</div>`;
            aiMsgs.scrollTop = aiMsgs.scrollHeight;

            try {
                const res = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'openai',
                        messages: [
                            { role: 'system', content: 'أنت مساعد خبير في Three.js و JavaScript. أجب بكود نظيف فقط عند الطلب. استخدم التعليقات بالعربية.' },
                            { role: 'user', content: text }
                        ]
                    })
                });
                const data = await res.json();
                document.getElementById('ai-loading').remove();
                aiMsgs.innerHTML += `<div style="color:#00e5ff; margin-bottom:5px;">🤖 ${data.choices[0].message.content}</div>`;
            } catch (e) {
                document.getElementById('ai-loading').remove();
                aiMsgs.innerHTML += `<div style="color:#f00;">خطأ في الاتصال.</div>`;
            }
            aiMsgs.scrollTop = aiMsgs.scrollHeight;
        };

        // 9. حلقة الرسم
        const clock = new THREE.Clock();
        let fpsAcc = 0, frames = 0;

        function resize() {
            const w = document.getElementById('viewport-container').clientWidth;
            const h = document.getElementById('viewport-container').clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);
        }

        window.addEventListener('resize', resize);
        resize();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            
            // تحديث الأنيميشن
            objects.forEach(o => { if (o.userData.mixer) o.userData.mixer.update(dt); });

            controls.update();
            renderer.render(scene, camera);

            fpsAcc += dt; frames++;
            if (fpsAcc >= 0.5) {
                document.getElementById('fps').innerText = Math.round(frames / fpsAcc);
                fpsAcc = 0; frames = 0;
            }
        }

        animate();
    </script>
</body>
</html>
