<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>KGTF ENGINE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=101">
</head>
<body>
    <header id="header">
        <div class="logo">KGTF <span>ENGINE</span></div>
        <div class="header-tools">
            <div class="gizmo-group">
                <button class="icon-btn active" id="btn-gizmo-translate">✥</button>
                <button class="icon-btn" id="btn-gizmo-rotate">↻</button>
                <button class="icon-btn" id="btn-gizmo-scale">⤢</button>
            </div>
            <div class="dropdown">
                <button class="icon-btn" id="btn-add-menu" style="color:#4ade80;">➕</button>
                <div class="dropdown-content" id="add-menu">
                    <button class="add-btn" data-type="cube">📦 مكعب</button>
                    <button class="add-btn" data-type="sphere">🔴 كرة</button>
                    <button class="add-btn" data-type="character">🏃 شخصية</button>
                    <button class="add-btn" data-type="tree">🌲 شجرة</button>
                </div>
            </div>
            <button class="icon-btn" id="btn-save" title="حفظ">💾</button>
            <button class="play-btn" id="btn-play">▶</button>
        </div>
    </header>

    <main id="viewport-container">
        <canvas id="viewport"></canvas>
        <div id="floating-controls">
            <button class="fab fab-green" id="btn-play-fab">▶ تشغيل</button>
            <button class="fab" id="btn-save-fab">💾 حفظ</button>
        </div>
        <div id="status-bar">FPS: <span id="fps">--</span></div>
    </main>

    <aside id="inspector-panel">
        <div class="panel-header">
            <span class="panel-title">OUTLINER & DETAILS</span>
            <button class="btn-small" id="btn-clear-scene" style="color:#ff5577;">مسح الكل</button>
        </div>
        <div id="object-list" style="padding:10px; display:flex; flex-wrap:wrap; gap:5px;"></div>
        
        <div id="inspector" style="display:none; padding:10px; background:#1a1a20; border-top:1px solid #333;">
            <div class="prop-row"><label>اللون</label><input type="color" id="prop-color" value="#00e5ff"></div>
            <div class="prop-row"><label>X</label><input type="range" id="prop-x" min="-50" max="50" step="0.1"></div>
            <div class="prop-row"><label>Y</label><input type="range" id="prop-y" min="-5" max="30" step="0.1"></div>
            <div class="prop-row"><label>Z</label><input type="range" id="prop-z" min="-50" max="50" step="0.1"></div>
        </div>
    </aside>

    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module" src="src/app.js?v=101"></script>
</body>
</html>
