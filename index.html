<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KGTF ENGINE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=100">
</head>
<body>
    <header id="header">
        <div class="header-tools">
            <button class="icon-btn" id="btn-play" style="background:#4ade80; color:#000;">▶ تشغيل</button>
        </div>
    </header>

    <main id="viewport-container">
        <canvas id="viewport"></canvas>
        
        <!-- واجهة اللعب -->
        <div id="play-ui" style="display:none;">
            <div id="debug-info" style="position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.8); color:#0f0; padding:5px; font-family:monospace; z-index:9999;">
                isPlaying: false<br>Joy: 0,0
            </div>
            <button id="exit-play" style="position:absolute; top:20px; left:20px; z-index:1000; padding:10px; background:red; color:white;">✕ إيقاف</button>
            <div id="joystick-zone"><div id="joystick-knob"></div></div>
            <button id="btn-jump">قفز</button>
        </div>
    </main>

    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module" src="src/main.js?v=100"></script>
</body>
</html>
