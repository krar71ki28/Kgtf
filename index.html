<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>KGTF ENGINE</title>
<!-- إضافة خط احترافي -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=11">
<script>
    if (window.location.search.includes("reset")) { localStorage.removeItem("kgtf_scene_final"); localStorage.removeItem("kgtf_assets"); localStorage.removeItem("kgtf_all_scenes"); window.location.href = window.location.pathname; }
</script>
</head>
<body>
    <header id="header">
        <div class="logo">KGTF <span>ENGINE</span></div>
        <div class="header-tools">
            <div class="gizmo-group"><button class="icon-btn active" id="btn-gizmo-translate" title="تحريك">✥</button><button class="icon-btn" id="btn-gizmo-rotate" title="تدوير">↻</button><button class="icon-btn" id="btn-gizmo-scale" title="تكبير">⤢</button></div>
            <button class="icon-btn" id="btn-focus" title="تركيز الكاميرا" style="color:#ffaa00;">🎯</button>
            <div class="dropdown">
                <button class="icon-btn" id="btn-add-menu" style="color:#4ade80;">➕</button>
                <div class="dropdown-content" id="add-menu">
                    <button id="btn-cube">📦 مكعب</button><button id="btn-sphere">🔴 كرة</button><button id="btn-cylinder">🛢️ أسطوانة</button><button id="btn-cone">🔺 مخروط</button><button id="btn-torus">🍩 حلقة</button>
                    <button id="btn-tree">🌲 شجرة</button><button id="btn-bush">🌿 شجيرة</button><button id="btn-mountain">⛰️ جبل</button><button id="btn-rock">🪨 صخرة</button><button id="btn-building">🏢 مبنى</button>
                    <button id="btn-camera">📷 كاميرا</button>
                    <button id="btn-light">💡 ضوء عادي</button><button id="btn-spotlight">🔦 كشاف</button><button id="btn-character">🏃 شخصية</button>
                    <button id="btn-vfx-fire" style="color:#ffaa00;">🔥 نار</button><button id="btn-vfx-sparks" style="color:#00e5ff;">✨ شرارات</button><button id="btn-vfx-smoke" style="color:#aaa;">☁️ دخان</button><button id="btn-audio" style="color:#ff5577;">🔊 مكبر صوت</button>
                </div>
            </div>
            <button class="icon-btn" id="btn-upload-model" title="رفع مجسم خارجي" style="color:#00e5ff;">📁</button>
            <input type="file" id="model-upload-input" accept=".glb,.gltf" style="display:none;">
            <button class="icon-btn" id="btn-save" title="حفظ">💾</button><button class="icon-btn" id="btn-export" title="تصدير">📤</button><button class="icon-btn" id="btn-import" title="استيراد">📥</button>
            <input type="file" id="file-import" accept=".json" style="display:none;">
            <button class="play-btn" id="btn-play">▶</button>
        </div>
    </header>

    <main id="viewport-container">
        <canvas id="viewport"></canvas>
        <div id="status-bar">FPS: <span id="fps">--</span></div>
        
        <!-- واجهة اللعب الاحترافية -->
        <div id="play-ui" style="display:none;">
            <div id="score-display" style="display:none;">النقاط: <span id="score-val">0</span></div>
            
            <button id="exit-play">
                <span>✕</span> إيقاف
            </button>
            
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-knob"></div>
                </div>
            </div>
            
            <button id="btn-jump">
                <span class="jump-icon">⬆</span>
                <span class="jump-text">قفز</span>
            </button>
        </div>
    </main>

    <aside id="inspector-panel">
        <div id="panel-tabs"><button class="tab-btn active" data-target="tab-outliner">Outliner</button><button class="tab-btn" data-target="tab-details">Details</button><button class="tab-btn" data-target="tab-content">Content</button><button class="tab-btn" data-target="tab-scenes">Scenes</button><button class="tab-btn" data-target="tab-world">World</button></div>
        <div class="panel-content-wrapper">
            <div class="panel-section tab-pane active" id="tab-outliner"><div class="panel-header"><span class="panel-title">SCENE OUTLINER</span><button class="btn-small" id="btn-clear-scene" style="color:#ff5577;">مسح الكل</button></div><div id="object-list"></div></div>
            <div class="panel-section tab-pane" id="tab-details">
                <div class="panel-header"><span class="panel-title" style="color:#00e5ff;">DETAILS</span><div id="object-actions" style="display:none; gap:5px;"><button class="btn-small" id="btn-save-asset" style="color:#ffaa00;">💾 حفظ كأصل</button><button class="btn-small" id="btn-duplicate" style="color:#4ade80;">تكرار</button><button class="btn-small" id="btn-delete" style="color:#ff5577;">حذف</button></div></div>
                <div id="no-selection-msg" style="text-align:center; color:#666; font-size:12px; margin-top:20px;">لم يتم تحديد أي مجسم.</div>
                <div id="inspector" style="display:none; overflow-y: auto; flex: 1; padding: 10px;">
                    <div class="prop-row" style="background:#1a1a24; padding:6px; border-radius:4px; margin-bottom:8px;"><label style="color:#aaa;">محاذاة الشبكة</label><input type="checkbox" id="prop-snap"></div>
                    <div class="prop-group" id="animation-properties" style="display:none; background: #25252b; padding: 8px; border-radius: 4px; border: 1px solid #3c3c45;"><div class="prop-title" style="color:#00e5ff;">ANIMATIONS</div><div class="prop-row"><label>الحركة</label><select id="anim-select" style="flex:1;"></select></div></div>
                    <div class="prop-group"><div class="prop-title">BEHAVIORS</div><div class="prop-row" style="display:flex; gap:5px; margin-bottom:5px;"><select id="add-behavior-select" style="flex:1;"></select><button class="btn-small" id="btn-add-behavior" style="background:#3b82f6; color:#fff;">إضافة</button></div><div id="active-behaviors-list"></div></div>
                    <div class="prop-group"><div class="prop-title">TRANSFORM</div><div class="prop-row"><label>المادة</label><select id="prop-material"><option value="default">عادي</option><option value="wood">خشب</option><option value="metal">معدن</option><option value="gold">ذهب</option><option value="glass">زجاج</option><option value="rubber">مطاط</option><option value="marble">رخام</option><option value="emissive">مضيء</option></select></div><div class="prop-row" style="margin-bottom:5px;"><button class="btn-small" id="btn-upload-texture" style="width:100%; background:#333; color:#fff;">🖼️ رفع خامة</button><input type="file" id="texture-input" accept="image/*" style="display:none;"></div><div class="prop-row"><label>اللون</label><input type="color" id="prop-color" value="#00e5ff"></div><div class="prop-row"><label>خشونة</label><input type="range" id="prop-roughness" min="0" max="1" step="0.05" value="0.5"></div><div class="prop-row"><label>معدنية</label><input type="range" id="prop-metalness" min="0" max="1" step="0.05" value="0.1"></div><div class="prop-row"><label>شفافية</label><input type="range" id="prop-opacity" min="0" max="1" step="0.05" value="1"></div><div class="prop-row"><label>X</label><input type="range" id="prop-x" min="-20" max="20" step="0.1" value="0"></div><div class="prop-row"><label>Y</label><input type="range" id="prop-y" min="-5" max="15" step="0.1" value="0.5"></div><div class="prop-row"><label>Z</label><input type="range" id="prop-z" min="-20" max="20" step="0.1" value="0"></div><div class="prop-row"><label>دوران X</label><input type="range" id="prop-rot-x" min="0" max="6.28" step="0.1" value="0"></div><div class="prop-row"><label>دوران Y</label><input type="range" id="prop-rot-y" min="0" max="6.28" step="0.1" value="0"></div><div class="prop-row"><label>دوران Z</label><input type="range" id="prop-rot-z" min="0" max="6.28" step="0.1" value="0"></div><div class="prop-row"><label>حجم</label><input type="range" id="prop-scale" min="0.1" max="4" step="0.1" value="1"></div></div>
                    <div class="prop-group" id="light-properties" style="display:none;"><div class="prop-title" style="color:#ffaa00;">LIGHT SETTINGS</div><div class="prop-row"><label>القوة</label><input type="range" id="prop-light-intensity" min="0" max="100" step="1" value="10"></div><div class="prop-row"><label>المدى</label><input type="range" id="prop-light-distance" min="1" max="100" step="1" value="15"></div></div>
                    <div class="prop-group"><div class="prop-title" style="color:#ffaa00;">PHYSICS</div><div class="prop-row"><label>جاذبية</label><input type="checkbox" id="prop-physics"></div><div class="prop-row"><label>ارتداد</label><input type="range" id="prop-bounce" min="0" max="1" step="0.1" value="0.5"></div></div>
                </div>
            </div>
            <div class="panel-section tab-pane" id="tab-content"><div class="panel-header"><span class="panel-title" style="color:#ffaa00;">ASSET LIBRARY</span><button class="btn-small" id="btn-clear-assets" style="color:#ff5577;">مسح المكتبة</button></div><div id="asset-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto;"></div></div>
            <div class="panel-section tab-pane" id="tab-scenes"><div class="panel-header"><span class="panel-title" style="color:#00e5ff;">SCENE MANAGER</span><button class="btn-small" id="btn-new-scene" style="background:#4ade80; color:#000;">+ مشهد جديد</button></div><div style="padding: 10px;"><div class="prop-row" style="margin-bottom: 15px;"><input type="text" id="new-scene-name" placeholder="اسم المشهد..." style="flex:1; background:#121215; border:1px solid #333; color:#fff; padding:8px; border-radius:4px;"><button class="btn-small" id="btn-save-scene-as" style="background:#3b82f6; color:#fff;">حفظ باسم</button></div><div id="scene-list" style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 25vh;"></div></div></div>
            <div class="panel-section tab-pane" id="tab-world">
                <div class="panel-header"><span class="panel-title" style="color:#ffaa00;">WORLD SETTINGS</span></div>
                <div style="padding: 15px; overflow-y: auto;">
                    <div class="prop-group"><div class="prop-title" style="color:#ff5577;">ACTIVE CAMERA</div><div class="prop-row"><select id="active-camera-select" style="width:100%; background:#121215; border:1px solid #333; color:#fff; padding:6px; border-radius:4px;"><option value="editor">Editor Camera (Default)</option></select></div></div>
                    <div class="prop-group" style="margin-top:15px;"><div class="prop-title" style="color:#ff5577;">TIME (الوقت)</div><div class="prop-row" style="background:#1a1a24; padding:6px; border-radius:4px; margin-bottom:8px;"><label style="color:#00e5ff; font-weight:bold;">الوضع الليلي</label><input type="checkbox" id="env-night-mode"></div><div class="prop-row"><label>دورة تلقائية</label><input type="checkbox" id="env-auto-cycle"></div><div class="prop-row"><label>الوقت (0-24)</label><input type="range" id="env-time-slider" min="0" max="24" step="0.1" value="6"></div><div class="prop-row"><label>شدة الشمس</label><input type="range" id="env-sun-intensity" min="0" max="5" step="0.1" value="2.0"></div><div class="prop-row"><label>الضباب</label><input type="range" id="env-fog-distance" min="20" max="200" step="5" value="120"></div></div>
                    <div class="prop-group" style="margin-top: 15px;"><div class="prop-title" style="color:#00e5ff;">WEATHER</div><div class="prop-row"><label>تفعيل المطر</label><input type="checkbox" id="env-rain-toggle"></div></div>
                    <div class="prop-group" style="margin-top: 15px;"><div class="prop-title" style="color:#4ade80;">BLOOM</div><div class="prop-row"><label>القوة</label><input type="range" id="pp-bloom-strength" min="0" max="3" step="0.1" value="0.3"></div></div><div class="prop-group" style="margin-top: 15px;"><div class="prop-title" style="color:#ff5577;">VIGNETTE</div><div class="prop-row"><label>تفعيل</label><input type="checkbox" id="pp-vignette-enabled" checked></div><div class="prop-row"><label>القوة</label><input type="range" id="pp-vignette-strength" min="0" max="2" step="0.1" value="1.0"></div></div>
                </div>
            </div>
        </div>
    </aside>
    
    <audio id="bgm" loop src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3"></audio>
    <audio id="jump-sfx" src="https://assets.mixkit.co/active_storage/sfx/224/224-preview.mp3"></audio>

    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module" src="src/main.js?v=79"></script>
</body>
</html>
