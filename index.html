<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KGTF ENGINE - Character Controller</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, sans-serif; background: #0a0a0f; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    #header { height: 50px; background: #141420; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; padding: 0 10px; gap: 10px; z-index: 10; flex-shrink: 0; overflow-x: auto; white-space: nowrap; }
    .logo { color: #00e5ff; font-weight: 900; letter-spacing: 1px; font-size: 14px; flex-shrink: 0; }
    .btn { background: #2a2a3a; color: #ccc; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
    .btn:hover { background: #3a3a4a; color: #fff; }
    .btn.primary { background: #00e5ff; color: #000; }
    .btn.green { background: #4ade80; color: #000; }
    
    #workspace { flex: 1; display: flex; overflow: hidden; position: relative; }
    
    #left-panel { width: 70px; background: #141420; border-left: 1px solid #2a2a3a; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 8px; z-index: 10; overflow-y: auto; }
    .icon-btn { width: 52px; height: 52px; background: #1e1e30; border: 1px solid #2a2a3a; border-radius: 8px; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; gap: 2px; padding: 4px; }
    .icon-btn span { font-size: 18px; }
    .icon-btn:hover { border-color: #00e5ff; color: #00e5ff; }

    #viewport-container { flex: 1; position: relative; background: #000; overflow: hidden; }
    #viewport { width: 100%; height: 100%; display: block; }

    #right-panel { width: 250px; background: #141420; border-right: 1px solid #2a2a3a; display: flex; flex-direction: column; z-index: 10; overflow-y: auto; }
    .panel-section { border-bottom: 1px solid #2a2a3a; padding: 10px; }
    .panel-title { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px; }
    .prop-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 5px; }
    .prop-row label { font-size: 11px; color: #aaa; width: 50px; flex-shrink: 0; }
    .prop-row input[type="range"] { flex: 1; }
    .prop-row input[type="color"] { width: 32px; height: 32px; border: none; background: none; cursor: pointer; }
    .prop-row input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
    .prop-row select { flex: 1; background: #0a0a0f; border: 1px solid #2a2a3a; color: #fff; padding: 4px; border-radius: 4px; font-size: 11px; }

    #status-bar { position: absolute; bottom: 10px; left: 10px; background: rgba(20,20,30,0.8); padding: 5px 10px; border-radius: 4px; font-size: 10px; font-family: monospace; color: #0f0; z-index: 5; border: 1px solid #2a2a3a; }

    #ai-fab { position: absolute; bottom: 20px; right: 20px; width: 50px; height: 50px; background: #ff5577; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,85,119,0.5); z-index: 20; }
    #ai-chat { position: absolute; bottom: 80px; right: 20px; width: 300px; max-width: calc(100vw - 40px); height: 400px; background: #141420; border: 1px solid #ff5577; border-radius: 12px; display: none; flex-direction: column; z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .ai-header { padding: 10px; background: #1e1e30; color: #ff5577; font-weight: bold; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
    .ai-messages { flex: 1; padding: 10px; overflow-y: auto; font-size: 12px; line-height: 1.5; color: #ddd; }
    .ai-input-row { padding: 10px; border-top: 1px solid #2a2a3a; display: flex; gap: 5px; }
    .ai-input-row input { flex: 1; background: #0a0a0f; border: 1px solid #2a2a3a; color: #fff; padding: 8px; border-radius: 4px; outline: none; }
    .ai-input-row button { background: #ff5577; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }

    /* عصا التحكم */
    #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; display: none; z-index: 100; touch-action: none; }
    #joystick-base { width: 100%; height: 100%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; position: relative; }
    #joystick-knob { width: 50px; height: 50px; background: #00e5ff; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(0,229,255,0.6); }

    body.play-mode #header, body.play-mode #left-panel, body.play-mode #right-panel, body.play-mode #ai-fab { display: none !important; }
    body.play-mode #workspace { flex-direction: column; }
    body.play-mode #joystick-zone { display: block; }
    #exit-play { position: absolute; top: 15px; left: 15px; z-index: 30; display: none; }
    body.play-mode #exit-play { display: block; }

    @media (max-width: 768px) {
        #workspace { flex-direction: column; }
        #left-panel { width: 100%; height: 62px; flex-direction: row; justify-content: space-around; border-left: none; border-bottom: 1px solid #2a2a3a; padding: 4px; gap: 4px; }
        .icon-btn { width: 48px; height: 48px; }
        #right-panel { width: 100%; height: 260px; border-right: none; border-top: 1px solid #2a2a3a; }
        #ai-chat { right: 10px; bottom: 70px; width: calc(100% - 20px); height: 60vh; }
        #status-bar { bottom: 270px; left: 10px; }
    }
</style>
</head>
<body>
    <div id="header">
        <div class="logo">KGTF ENGINE</div>
        <div style="flex:1"></div>
        <button class="btn" id="btn-save">💾 حفظ</button>
        <button class="btn green" id="btn-play">▶ تشغيل</button>
    </div>

    <div id="workspace">
        <div id="left-panel">
            <button class="icon-btn" id="btn-cube"><span>📦</span>مكعب</button>
            <button class="icon-btn" id="btn-sphere"><span>🔴</span>كرة</button>
            <button class="icon-btn" id="btn-cylinder"><span>🛢️</span>أسطوانة</button>
            <button class="icon-btn" id="btn-light"><span>💡</span>ضوء</button>
            <button class="icon-btn" id="btn-character"><span>🏃</span>شخصية</button>
        </div>

        <div id="viewport-container">
            <canvas id="viewport"></canvas>
            <button class="btn primary" id="exit-play">✕ خروج</button>
            <div id="status-bar">FPS: <span id="fps">--</span></div>
            
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-knob"></div>
                </div>
            </div>

            <div id="ai-fab">🤖</div>
            <div id="ai-chat">
                <div class="ai-header"><span>KGTF AI Assistant</span><span id="close-ai" style="cursor:pointer;">✕</span></div>
                <div class="ai-messages" id="ai-messages">مرحباً! أنا مساعدك. اطلب مني كود Three.js.</div>
                <div class="ai-input-row">
                    <input type="text" id="ai-input" placeholder="اطلب كود..." />
                    <button id="ai-send">إرسال</button>
                </div>
            </div>
        </div>

        <div id="right-panel">
            <div class="panel-section">
                <div class="panel-title">HIERARCHY</div>
                <div id="object-list" style="font-size:12px; color:#aaa; max-height:110px; overflow-y:auto;"></div>
            </div>
            
            <div class="panel-section" id="inspector" style="display:none;">
                <div class="panel-title">PROPERTIES</div>
                <div class="prop-row"><label>المادة</label>
                    <select id="prop-material">
                        <option value="default">عادي</option>
                        <option value="wood">خشب</option>
                        <option value="metal">معدن</option>
                        <option value="gold">ذهب</option>
                        <option value="glass">زجاج</option>
                        <option value="rubber">مطاط</option>
                        <option value="marble">رخام</option>
                        <option value="emissive">مضيء</option>
                    </select>
                </div>
                <div class="prop-row"><label>اللون</label><input type="color" id="prop-color" value="#00e5ff"></div>
                <div class="prop-row"><label>X</label><input type="range" id="prop-x" min="-20" max="20" step="0.1" value="0"></div>
                <div class="prop-row"><label>Y</label><input type="range" id="prop-y" min="-5" max="15" step="0.1" value="0.5"></div>
                <div class="prop-row"><label>Z</label><input type="range" id="prop-z" min="-20" max="20" step="0.1" value="0"></div>
                <div class="prop-row"><label>دوران</label><input type="range" id="prop-rot" min="0" max="6.28" step="0.1" value="0"></div>
                <div class="prop-row"><label>حجم</label><input type="range" id="prop-scale" min="0.1" max="4" step="0.1" value="1"></div>
                
                <div class="panel-title" style="margin-top:15px; color:#ffaa00;">PHYSICS</div>
                <div class="prop-row"><label>جاذبية</label><input type="checkbox" id="prop-physics"></div>
                <div class="prop-row"><label>ارتداد</label><input type="range" id="prop-bounce" min="0" max="1" step="0.1" value="0.5"></div>
                
                <div class="prop-row" style="margin-top:10px;"><label>حذف</label><button class="btn" id="btn-delete" style="width:100%; background:#3a1a1a; color:#ff5577;">حذف العنصر</button></div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const MATERIALS = {
            default:  { color: 0x00e5ff, roughness: 0.4, metalness: 0.1 },
            wood:     { color: 0x8b5a2b, roughness: 0.95, metalness: 0.0 },
            metal:    { color: 0xaaaaaa, roughness: 0.2,  metalness: 0.9 },
            gold:     { color: 0xffaa00, roughness: 0.3,  metalness: 0.95 },
            glass:    { color: 0x88ccff, roughness: 0.05, metalness: 0.0, transparent: true, opacity: 0.4 },
            rubber:   { color: 0x222222, roughness: 1.0,  metalness: 0.0 },
            marble:   { color: 0xeeeeee, roughness: 0.4,  metalness: 0.0 },
            emissive: { color: 0x00e5ff, emissive: 0x00e5ff, emissiveIntensity: 1.0 }
        };

        const canvas = document.getElementById('viewport');
        const scene = new THREE.Scene();
        
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        const envMap = pmremGenerator.fromScene(new RoomEnvironment()).texture;
        scene.environment = envMap;
        scene.background = new THREE.Color(0x0a0a0f);

        const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
        camera.position.set(8, 6, 10);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 2, 0);
        controls.maxPolarAngle = Math.PI / 2.05;

        const sun = new THREE.DirectionalLight(0xffeedd, 2.0);
        sun.position.set(10, 20, 10);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
        sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
        sun.shadow.bias = -0.0005;
        scene.add(sun);

        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.8, metalness: 0.2 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        let objects = [];
        let selected = null;
        let idCounter = 1;
        
        let player = null;
        let isPlaying = false;

        function makeMaterial(matName, colorHex) {
            const base = MATERIALS[matName] || MATERIALS.default;
            const opts = { ...base };
            if (colorHex !== undefined) opts.color = colorHex;
            return new THREE.MeshStandardMaterial(opts);
        }

        function addObject(type, opts = {}) {
            let obj;
            if (type === 'cube') {
                obj = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), makeMaterial('default'));
                obj.position.y = 0.5;
            } else if (type === 'sphere') {
                obj = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), makeMaterial('default'));
                obj.position.y = 0.5;
            } else if (type === 'cylinder') {
                obj = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.2, 32), makeMaterial('default'));
                obj.position.y = 0.6;
            } else if (type === 'light') {
                obj = new THREE.PointLight(0xffaa00, 5, 15);
                obj.position.set(0, 3, 0);
            }
            
            if (obj.isMesh) {
                obj.castShadow = true;
                obj.receiveShadow = true;
            }
            
            obj.userData = { 
                id: 'obj_' + (idCounter++), 
                type: type, 
                material: 'default',
                physics: { enabled: false, vy: 0, bounce: 0.5 }
            };
            
            if (opts.position) obj.position.fromArray(opts.position);
            if (opts.rotation) obj.rotation.set(opts.rotation[0] || 0, opts.rotation[1] || 0, opts.rotation[2] || 0);
            if (opts.scale) obj.scale.fromArray(opts.scale);
            
            if (opts.material && obj.isMesh) {
                obj.material.dispose();
                obj.material = makeMaterial(opts.material, opts.color);
                obj.userData.material = opts.material;
            } else if (opts.color && obj.isMesh) {
                obj.material.color.set(opts.color);
            }
            if (opts.color && obj.isLight) obj.color.set(opts.color);
            if (opts.intensity && obj.isLight) obj.intensity = opts.intensity;
            
            if (opts.physics) {
                obj.userData.physics = { ...obj.userData.physics, ...opts.physics };
            }
            
            scene.add(obj);
            objects.push(obj);
            updateList();
            selectObject(obj);
            return obj;
        }

        function selectObject(obj) {
            selected = obj;
            const insp = document.getElementById('inspector');
            if (!obj) { insp.style.display = 'none'; return; }
            insp.style.display = 'block';

            if (obj.isMesh) {
                document.getElementById('prop-color').value = '#' + obj.material.color.getHexString();
                document.getElementById('prop-material').value = obj.userData.material || 'default';
                document.getElementById('prop-physics').disabled = false;
                document.getElementById('prop-bounce').disabled = false;
                document.getElementById('prop-physics').checked = obj.userData.physics.enabled;
                document.getElementById('prop-bounce').value = obj.userData.physics.bounce;
            } else {
                document.getElementById('prop-physics').disabled = true;
                document.getElementById('prop-bounce').disabled = true;
                document.getElementById('prop-physics').checked = false;
                if (obj.isLight) document.getElementById('prop-color').value = '#' + obj.color.getHexString();
            }
            
            document.getElementById('prop-x').value = obj.position.x;
            document.getElementById('prop-y').value = obj.position.y;
            document.getElementById('prop-z').value = obj.position.z;
            document.getElementById('prop-rot').value = obj.rotation.y;
            document.getElementById('prop-scale').value = obj.scale.x;
        }

        function deleteSelected() {
            if (!selected) return;
            const idx = objects.indexOf(selected);
            if (idx !== -1) {
                scene.remove(selected);
                if (selected.material) selected.material.dispose();
                objects.splice(idx, 1);
                selected = null;
                document.getElementById('inspector').style.display = 'none';
                updateList();
            }
        }

        function updateList() {
            const list = document.getElementById('object-list');
            list.innerHTML = '';
            objects.forEach(o => {
                const div = document.createElement('div');
                div.innerText = o.userData.type + ' — ' + o.userData.id;
                div.style.cursor = 'pointer';
                div.style.padding = '4px';
                div.style.borderRadius = '4px';
                if (o === selected) { div.style.background = '#1a2a3a'; div.style.color = '#00e5ff'; }
                div.onclick = () => selectObject(o);
                list.appendChild(div);
            });
        }

        function loadCharacter() {
            const loader = new GLTFLoader();
            loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb', (gltf) => {
                const model = gltf.scene;
                model.position.y = 0;
                model.scale.set(0.5, 0.5, 0.5);
                model.traverse(o => { if(o.isMesh) o.castShadow = true; });
                
                const mixer = new THREE.AnimationMixer(model);
                const actions = {};
                gltf.animations.forEach(clip => {
                    actions[clip.name] = mixer.clipAction(clip);
                });

                if (actions['Idle']) actions['Idle'].play();

                model.userData = { 
                    id: 'char_' + (idCounter++), 
                    type: 'character', 
                    mixer: mixer, 
                    actions: actions,
                    currentAction: 'Idle',
                    material: 'n/a', 
                    physics: { enabled: false, vy: 0, bounce: 0 }
                };
                
                scene.add(model);
                objects.push(model);
                updateList();
                selectObject(model);
            }, undefined, (err) => {
                console.error('فشل تحميل الشخصية', err);
                alert('تعذر تحميل الشخصية. تأكد من الإنترنت.');
            });
        }

        document.getElementById('btn-cube').onclick = () => addObject('cube');
        document.getElementById('btn-sphere').onclick = () => addObject('sphere');
        document.getElementById('btn-cylinder').onclick = () => addObject('cylinder');
        document.getElementById('btn-light').onclick = () => addObject('light');
        document.getElementById('btn-character').onclick = loadCharacter;

        document.getElementById('prop-material').onchange = (e) => {
            if (selected && selected.isMesh) {
                const oldColor = selected.material.color.getHex();
                selected.material.dispose();
                selected.material = makeMaterial(e.target.value, oldColor);
                selected.userData.material = e.target.value;
                document.getElementById('prop-color').value = '#' + oldColor.toString(16).padStart(6, '0');
            }
        };
        document.getElementById('prop-color').oninput = (e) => {
            if (!selected) return;
            if (selected.isMesh) selected.material.color.set(e.target.value);
            else if (selected.isLight) selected.color.set(e.target.value);
        };
        document.getElementById('prop-x').oninput = (e) => { if (selected) selected.position.x = parseFloat(e.target.value); };
        document.getElementById('prop-y').oninput = (e) => { 
            if (selected) {
                selected.position.y = parseFloat(e.target.value);
                if (selected.userData.physics) selected.userData.physics.vy = 0;
            }
        };
        document.getElementById('prop-z').oninput = (e) => { if (selected) selected.position.z = parseFloat(e.target.value); };
        document.getElementById('prop-rot').oninput = (e) => { if (selected) selected.rotation.y = parseFloat(e.target.value); };
        document.getElementById('prop-scale').oninput = (e) => { if (selected) selected.scale.setScalar(parseFloat(e.target.value)); };
        document.getElementById('prop-physics').onchange = (e) => {
            if (selected && selected.userData.physics) {
                selected.userData.physics.enabled = e.target.checked;
                selected.userData.physics.vy = 0;
            }
        };
        document.getElementById('prop-bounce').oninput = (e) => {
            if (selected && selected.userData.physics) selected.userData.physics.bounce = parseFloat(e.target.value);
        };
        document.getElementById('btn-delete').onclick = deleteSelected;

        document.getElementById('btn-save').onclick = () => {
            const data = objects
                .filter(o => o.userData.type !== 'character')
                .map(o => ({
                    type: o.userData.type,
                    material: o.userData.material,
                    color: o.isMesh ? o.material.color.getHex() : (o.isLight ? o.color.getHex() : 0xffffff),
                    intensity: o.isLight ? o.intensity : undefined,
                    position: o.position.toArray(),
                    rotation: [o.rotation.x, o.rotation.y, o.rotation.z],
                    scale: o.scale.toArray(),
                    physics: o.userData.physics
                }));
            localStorage.setItem('kgtf_scene_v5', JSON.stringify(data));
            alert('تم حفظ المشهد (' + data.length + ' كائن)');
        };

        function loadScene() {
            const saved = localStorage.getItem('kgtf_scene_v5');
            if (!saved) { addObject('cube'); return; }
            try {
                const data = JSON.parse(saved);
                data.forEach(d => {
                    addObject(d.type, {
                        material: d.material,
                        color: d.color,
                        intensity: d.intensity,
                        position: d.position,
                        rotation: d.rotation,
                        scale: d.scale,
                        physics: d.physics
                    });
                });
            } catch(e) { console.error(e); addObject('cube'); }
        }

        document.getElementById('btn-play').onclick = () => {
            player = objects.find(o => o.userData.type === 'character');
            if (!player) { alert('أضف شخصية أولاً لتتمكن من اللعب!'); return; }
            
            isPlaying = true;
            document.body.classList.add('play-mode');
            camera.position.copy(player.position).add(new THREE.Vector3(0, 3, -6));
            controls.target.copy(player.position);
            resize();
        };

        document.getElementById('exit-play').onclick = () => {
            isPlaying = false;
            document.body.classList.remove('play-mode');
            resize();
        };

        const jZone = document.getElementById('joystick-zone');
        const jKnob = document.getElementById('joystick-knob');
        let jActive = false;
        let jVector = new THREE.Vector2(0, 0);
        const maxJDist = 35;

        function handleJoyStart(e) { jActive = true; handleJoyMove(e); }
        function handleJoyMove(e) {
            if (!jActive) return;
            const touch = e.touches ? e.touches[0] : e;
            const rect = jZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxJDist) {
                dx = (dx / dist) * maxJDist;
                dy = (dy / dist) * maxJDist;
            }
            jKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            jVector.x = dx / maxJDist;
            jVector.y = dy / maxJDist;
        }
        function handleJoyEnd() {
            jActive = false;
            jKnob.style.transform = `translate(-50%, -50%)`;
            jVector.set(0, 0);
        }

        jZone.addEventListener('touchstart', handleJoyStart, {passive: false});
        jZone.addEventListener('touchmove', handleJoyMove, {passive: false});
        jZone.addEventListener('touchend', handleJoyEnd);
        jZone.addEventListener('mousedown', handleJoyStart);
        window.addEventListener('mousemove', handleJoyMove);
        window.addEventListener('mouseup', handleJoyEnd);

        const clock = new THREE.Clock();
        let fpsAcc = 0, frames = 0;
        const box = new THREE.Box3();
        const size = new THREE.Vector3();

        function resize() {
            const c = document.getElementById('viewport-container');
            const w = c.clientWidth, h = c.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);
        }
        window.addEventListener('resize', resize);
        setTimeout(resize, 50);

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);

            objects.forEach(o => {
                if (o.userData.mixer) o.userData.mixer.update(dt);
                const p = o.userData.physics;
                if (p && p.enabled && o.isMesh) {
                    p.vy -= 9.8 * dt;
                    o.position.y += p.vy * dt;
                    box.setFromObject(o);
                    box.getSize(size);
                    const groundLevel = size.y / 2;
                    if (o.position.y < groundLevel) {
                        o.position.y = groundLevel;
                        if (Math.abs(p.vy) > 0.5) p.vy = -p.vy * p.bounce;
                        else p.vy = 0;
                    }
                }
            });

            if (isPlaying && player) {
                const speed = 5;
                if (jVector.lengthSq() > 0.01) {
                    player.position.z -= jVector.y * speed * dt;
                    player.position.x += jVector.x * speed * dt;
                    const targetRot = Math.atan2(jVector.x, -jVector.y);
                    player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, targetRot, 10 * dt);

                    if (player.userData.actions && player.userData.actions['Walking'] && player.userData.currentAction !== 'Walking') {
                        if (player.userData.actions[player.userData.currentAction]) player.userData.actions[player.userData.currentAction].fadeOut(0.2);
                        player.userData.actions['Walking'].reset().fadeIn(0.2).play();
                        player.userData.currentAction = 'Walking';
                    }
                } else {
                    if (player.userData.actions && player.userData.actions['Idle'] && player.userData.currentAction !== 'Idle') {
                        if (player.userData.actions[player.userData.currentAction]) player.userData.actions[player.userData.currentAction].fadeOut(0.2);
                        player.userData.actions['Idle'].reset().fadeIn(0.2).play();
                        player.userData.currentAction = 'Idle';
                    }
                }

                const targetCamPos = player.position.clone().add(new THREE.Vector3(0, 3, -6).applyAxisAngle(new THREE.Vector3(0,1,0), player.rotation.y));
                camera.position.lerp(targetCamPos, 5 * dt);
                controls.target.lerp(player.position.clone().add(new THREE.Vector3(0, 1, 0)), 5 * dt);
            }

            controls.update();
            renderer.render(scene, camera);

            fpsAcc += dt; frames++;
            if (fpsAcc >= 0.5) {
                document.getElementById('fps').innerText = Math.round(frames / fpsAcc);
                fpsAcc = 0; frames = 0;
            }
        }

        loadScene();
        animate();
    </script>
</body>
</html>
