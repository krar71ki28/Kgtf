<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KGTF ENGINE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header"><div class="logo">KGTF ENGINE</div></div>
    <div id="workspace">
        <div id="left-panel">
            <button class="icon-btn" id="btn-cube"><span>📦</span>مكعب</button>
            <button class="icon-btn" id="btn-sphere"><span>🔴</span>كرة</button>
            <button class="icon-btn" id="btn-cylinder"><span>🛢️</span>أسطوانة</button>
            <button class="icon-btn" id="btn-light"><span>💡</span>ضوء</button>
            <button class="icon-btn" id="btn-character"><span>🏃</span>شخصية</button>
        </div>
        <div id="viewport-container">
            <canvas id="viewport"></canvas>
            <div id="floating-controls">
                <button class="fab-btn green" id="btn-play">▶ تشغيل</button>
                <button class="fab-btn" id="btn-save">💾 حفظ</button>
                <button class="fab-btn" id="btn-gizmo-translate" style="background:#00e5ff; padding: 10px; font-size: 18px;" title="تحريك">✥</button>
                <button class="fab-btn" id="btn-gizmo-rotate" style="background:#ffaa00; padding: 10px; font-size: 18px;" title="تدوير">↻</button>
                <button class="fab-btn" id="btn-gizmo-scale" style="background:#4ade80; padding: 10px; font-size: 18px;" title="تكبير">⤢</button>
            </div>
            <button id="exit-play">✕ خروج</button>
            <div id="status-bar">FPS: <span id="fps">--</span></div>
            <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
            <div id="ai-fab">🤖</div>
            <div id="ai-chat">
                <div class="ai-header"><span>KGTF AI</span><span id="close-ai" style="cursor:pointer;">✕</span></div>
                <div class="ai-messages" id="ai-messages">مرحباً! اطلب مني كود Three.js.</div>
                <div class="ai-input-row"><input type="text" id="ai-input" placeholder="اطلب كود..." /><button id="ai-send">إرسال</button></div>
            </div>
        </div>
        <div id="right-panel">
            <div class="panel-section">
                <div class="panel-title">HIERARCHY</div>
                <div id="object-list" style="font-size:12px; color:#aaa; max-height:80px; overflow-y:auto;"></div>
                <!-- زر مسح المشهد -->
                <button class="btn" id="btn-clear-scene" style="width:100%; margin-top:10px; background:#3a1a1a; color:#ff5577; border: 1px solid #ff5577;">🗑️ مسح المشهد (Clear Scene)</button>
            </div>
            <div class="panel-section" id="inspector" style="display:none;">
                <div class="panel-title">PROPERTIES</div>
                <div class="prop-row" style="margin-bottom:15px; display: flex; gap: 10px;">
                    <button class="btn" id="btn-duplicate" style="flex:1; background:#1a3a2a; color:#4ade80; padding:10px;">📑 تكرار</button>
                    <button class="btn" id="btn-delete" style="flex:1; background:#3a1a1a; color:#ff5577; padding:10px;">🗑️ حذف</button>
                </div>
                
                <div class="panel-title" style="color:#ffaa00;">PHYSICS</div>
                <div class="prop-row"><label>جاذبية</label><input type="checkbox" id="prop-physics"></div>
                <div class="prop-row"><label>ارتداد</label><input type="range" id="prop-bounce" min="0" max="1" step="0.1" value="0.5"></div>
                
                <div class="panel-title" style="margin-top:15px; color:#888;">TRANSFORM</div>
                <div class="prop-row"><label>المادة</label><select id="prop-material"><option value="default">عادي</option><option value="wood">خشب</option><option value="metal">معدن</option><option value="gold">ذهب</option><option value="glass">زجاج</option><option value="rubber">مطاط</option><option value="marble">رخام</option><option value="emissive">مضيء</option></select></div>
                <div class="prop-row"><label>اللون</label><input type="color" id="prop-color" value="#00e5ff"></div>
                <div class="prop-row"><label>X</label><input type="range" id="prop-x" min="-20" max="20" step="0.1" value="0"></div>
                <div class="prop-row"><label>Y</label><input type="range" id="prop-y" min="-5" max="15" step="0.1" value="0.5"></div>
                <div class="prop-row"><label>Z</label><input type="range" id="prop-z" min="-20" max="20" step="0.1" value="0"></div>
                <div class="prop-row"><label>دوران</label><input type="range" id="prop-rot" min="0" max="6.28" step="0.1" value="0"></div>
                <div class="prop-row"><label>حجم</label><input type="range" id="prop-scale" min="0.1" max="4" step="0.1" value="1"></div>
            </div>
        </div>
    </div>
    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <!-- تحديث رقم الكاش لـ v=6 -->
    <script type="module" src="src/main.js?v=9"></script>
</body>
</html>
