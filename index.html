<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KGTF ENGINE v4.1</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=115">
</head>
<body>
    <header id="header">
        <div class="header-tools">
            <div class="dropdown">
                <button class="icon-btn" id="btn-add-menu" style="color:#4ade80;">➕ إضافة</button>
                <div class="dropdown-content" id="add-menu">
                    <button class="add-btn" data-type="cube">📦 مكعب</button>
                    <button class="add-btn" data-type="sphere">🔴 كرة</button>
                    <button class="add-btn" data-type="character">🏃 شخصية (لعب)</button>
                </div>
            </div>
            <button class="icon-btn" id="btn-save" style="color:#ffaa00;">💾 حفظ</button>
            <button class="icon-btn" id="btn-clear-scene" style="color:#ff5577;">مسح الكل</button>
        </div>
        <button class="play-btn" id="btn-play">▶</button>
    </header>

    <main id="viewport-container">
        <canvas id="viewport"></canvas>
        <div id="play-ui" style="display:none;">
            <button id="exit-play" style="position:absolute; top:20px; left:20px; z-index:1000; padding:10px; background:red; color:white; border:none; border-radius:5px;">✕ إيقاف</button>
            <div id="joystick-zone"><div id="joystick-knob"></div></div>
            <button id="btn-jump">قفز</button>
        </div>
    </main>

    <aside id="inspector-panel">
        <div class="panel-header"><span class="panel-title">OUTLINER</span></div>
        <div id="object-list"></div>
        
        <div id="inspector" style="display:none; padding:10px; background:#1a1a20; border-top:1px solid #333; overflow-y:auto;">
            <div class="prop-row" id="anim-container" style="display:none; margin-bottom: 15px; background:#25252b; padding:8px; border-radius:5px;">
                <label style="color:#00e5ff; font-weight:bold;">الحركة</label>
                <select id="anim-select" style="flex:1; background:#121215; color:#fff; border:1px solid #444; padding:4px; border-radius:4px;"></select>
            </div>

            <div class="prop-row"><label>اللون</label><input type="color" id="prop-color" value="#00e5ff"></div>
            <div class="prop-row"><label>X</label><input type="range" id="prop-x" min="-20" max="20" step="0.1"></div>
            <div class="prop-row"><label>Z</label><input type="range" id="prop-z" min="-20" max="20" step="0.1"></div>
            <div class="prop-row" style="margin-top: 10px;">
                <input type="checkbox" id="prop-physics" style="width:20px; height:20px;">
                <label style="color:#ffaa00; font-weight:bold;">تفعيل الجاذبية</label>
            </div>
            
            <!-- ✅ إضافة خيار المطر -->
            <div class="prop-row" style="margin-top: 10px; border-top: 1px solid #444; padding-top: 10px;">
                <input type="checkbox" id="env-rain" style="width:20px; height:20px;">
                <label style="color:#00e5ff; font-weight:bold;">تفعيل المطر</label>
            </div>

            <div id="logic-section" style="display:none; margin-top:15px; padding-top:10px; border-top:1px solid #444;">
                <label style="color:#4ade80; font-weight:bold; display:block; margin-bottom:5px;">البرمجة المرئية</label>
                <div class="prop-row">
                    <select id="logic-event" style="flex:1; background:#121215; color:#fff; border:1px solid #444; padding:4px; margin-left:5px;">
                        <option value="onCollide">عند الاصطدام</option>
                        <option value="onStart">عند البدء</option>
                    </select>
                    <select id="logic-action" style="flex:1; background:#121215; color:#fff; border:1px solid #444; padding:4px;">
                        <option value="addScore">إضافة نقاط</option>
                        <option value="destroy">تدمير</option>
                    </select>
                </div>
                <button id="btn-add-logic" style="width:100%; margin-top:5px; background:#4ade80; color:#000; font-weight:bold; padding:5px; border:none; border-radius:4px;">إضافة حدث</button>
                <div id="logic-list" style="margin-top:10px; font-size:12px; color:#aaa;"></div>
            </div>
        </div>
    </aside>

    <script type="importmap">
    { "imports": { 
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    } }
    </script>
    <script type="module" src="src/main.js?v=115"></script>
</body>
</html>
