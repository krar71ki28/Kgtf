<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KGTF ENGINE v1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1000">
</head>
<body>
    <header id="header">
        <div class="header-tools">
            <button class="icon-btn" id="btn-add-cube" title="إضافة مكعب">📦</button>
            <button class="icon-btn" id="btn-add-character" title="إضافة شخصية">🏃</button>
            <button class="icon-btn" id="btn-clear-scene" title="مسح الكل">🗑️</button>

            <button class="icon-btn" id="btn-save-scene" title="حفظ المشهد">💾</button>
            <button class="icon-btn" id="btn-load-scene" title="تحميل مشهد">📂</button>
            <button class="icon-btn" id="btn-new-scene" title="مشهد جديد">🆕</button>

            <input
                type="file"
                id="scene-file-input"
                accept=".json,application/json"
                style="display:none"
            >
        </div>

        <button class="play-btn" id="btn-play">▶</button>
    </header>

    <main id="viewport-container">
        <canvas id="viewport"></canvas>

        <div id="play-ui" style="display:none;">
            <button id="exit-play" style="position:absolute; top:20px; left:20px; z-index:1000; padding:10px; background:red; color:white; border:none; border-radius:5px; font-weight:bold;">✕ إيقاف</button>
            <div id="joystick-zone"><div id="joystick-knob"></div></div>
            <button id="btn-jump">قفز</button>
        </div>
    </main>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>

    <script type="module" src="src/main.js?v=1000"></script>
</body>
</html>
