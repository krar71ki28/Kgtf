<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KGTF ENGINE - Editor</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; font-family: system-ui, sans-serif; color: #fff; }
    #viewport { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* الواجهة العلوية */
    #topbar { position: absolute; top: 0; left: 0; right: 0; height: 50px; background: rgba(20,20,30,0.9); border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; padding: 0 10px; gap: 10px; z-index: 10; backdrop-filter: blur(5px); overflow-x: auto; }
    .btn { background: #2a2a3a; color: #ccc; border: 1px solid #3a3a4a; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn:hover, .btn.active { background: #00e5ff; color: #000; border-color: #00e5ff; }
    .btn.danger { background: #3a1a1a; color: #ff5577; border-color: #5a2a2a; }
    
    /* القائمة الجانبية */
    #sidebar { position: absolute; top: 50px; right: 0; width: 200px; height: calc(100% - 50px); background: rgba(20,20,30,0.9); border-left: 1px solid #2a2a3a; padding: 10px; z-index: 10; overflow-y: auto; backdrop-filter: blur(5px); }
    .obj-item { padding: 8px; margin-bottom: 5px; background: #141420; border: 1px solid #2a2a3a; border-radius: 4px; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; }
    .obj-item.selected { border-color: #00e5ff; background: #1a2a3a; color: #00e5ff; }
    
    /* شريط الحالة */
    #hud { position: absolute; bottom: 10px; left: 10px; background: rgba(20,20,30,0.8); padding: 6px 10px; border-radius: 6px; font-size: 10px; font-family: monospace; color: #0f0; z-index: 10; border: 1px solid #2a2a3a; }
    
    @media (max-width: 600px) {
        #sidebar { width: 140px; }
    }
</style>
</head>
<body>
    <canvas id="viewport"></canvas>
    
    <div id="topbar">
        <button class="btn" id="btn-translate">تحريك</button>
        <button class="btn" id="btn-rotate">تدوير</button>
        <button class="btn" id="btn-scale">تكبير</button>
        <div style="width:1px; height:20px; background:#444;"></div>
        <button class="btn" id="btn-add-cube">+ مكعب</button>
        <button class="btn" id="btn-add-sphere">+ كرة</button>
        <button class="btn danger" id="btn-delete">حذف</button>
        <div style="flex:1"></div>
        <button class="btn" id="btn-save" style="background:#00e5ff; color:#000;">حفظ</button>
    </div>

    <div id="sidebar">
        <div style="font-size:10px; color:#888; margin-bottom:10px; font-weight:bold;">HIERARCHY</div>
        <div id="object-list"></div>
    </div>

    <div id="hud">FPS: <span id="fps">--</span> | Draws: <span id="dc">--</span></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        // --- Core Engine Setup ---
        const canvas = document.getElementById('viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        scene.fog = new THREE.Fog(0x0a0a0f, 10, 50);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;
        orbitControls.target.set(0, 1, 0);

        // --- Lighting ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(1024, 1024);
        scene.add(dirLight);

        // --- Ground ---
        const grid = new THREE.GridHelper(50, 50, 0x2a2a3a, 0x1a1a2e);
        scene.add(grid);

        // --- Gizmo (Transform Controls) ---
        const transformControls = new TransformControls(camera, renderer.domElement);
        transformControls.addEventListener('dragging-changed', function (event) {
            orbitControls.enabled = !event.value;
        });
        scene.add(transformControls);

        // --- Editor State ---
        let objects = [];
        let selectedId = null;
        let idCounter = 1;

        function addObject(type) {
            let mesh;
            const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.5 });
            
            if (type === 'cube') {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
                mesh.position.y = 0.5;
            } else if (type === 'sphere') {
                mesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), mat);
                mesh.position.y = 0.5;
            }
            
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            const id = 'obj_' + idCounter++;
            mesh.userData = { id, type };
            
            scene.add(mesh);
            objects.push(mesh);
            updateUI();
            selectObject(id);
        }

        function selectObject(id) {
            selectedId = id;
            const obj = objects.find(o => o.userData.id === id);
            if (obj) {
                transformControls.attach(obj);
            } else {
                transformControls.detach();
            }
            updateUI();
        }

        function deleteObject() {
            if (!selectedId) return;
            const index = objects.findIndex(o => o.userData.id === selectedId);
            if (index !== -1) {
                scene.remove(objects[index]);
                objects.splice(index, 1);
                transformControls.detach();
                selectedId = null;
                updateUI();
            }
        }

        function updateUI() {
            const list = document.getElementById('object-list');
            list.innerHTML = '';
            objects.forEach(obj => {
                const div = document.createElement('div');
                div.className = 'obj-item' + (obj.userData.id === selectedId ? ' selected' : '');
                div.innerHTML = `<span>${obj.userData.type}</span> <span>${obj.userData.id}</span>`;
                div.onclick = () => selectObject(obj.userData.id);
                list.appendChild(div);
            });
        }

        // --- UI Event Listeners ---
        document.getElementById('btn-add-cube').onclick = () => addObject('cube');
        document.getElementById('btn-add-sphere').onclick = () => addObject('sphere');
        document.getElementById('btn-delete').onclick = deleteObject;

        document.getElementById('btn-translate').onclick = (e) => { transformControls.setMode('translate'); setActiveBtn(e.target); };
        document.getElementById('btn-rotate').onclick = (e) => { transformControls.setMode('rotate'); setActiveBtn(e.target); };
        document.getElementById('btn-scale').onclick = (e) => { transformControls.setMode('scale'); setActiveBtn(e.target); };

        function setActiveBtn(btn) {
            document.querySelectorAll('#topbar .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // --- Save / Load ---
        document.getElementById('btn-save').onclick = () => {
            const data = objects.map(o => ({
                type: o.userData.type,
                pos: o.position.toArray(),
                rot: o.rotation.toArray(),
                scale: o.scale.toArray(),
                color: o.material.color.getHex()
            }));
            localStorage.setItem('kgtf_scene', JSON.stringify(data));
            alert('تم حفظ المشهد!');
        };

        function loadScene() {
            const saved = localStorage.getItem('kgtf_scene');
            if (!saved) return;
            const data = JSON.parse(saved);
            data.forEach(d => {
                let mesh;
                const mat = new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.5 });
                if (d.type === 'cube') mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mat);
                if (d.type === 'sphere') mesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), mat);
                
                mesh.position.fromArray(d.pos);
                mesh.rotation.fromArray(d.rot);
                mesh.scale.fromArray(d.scale);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                
                mesh.userData = { id: 'obj_' + idCounter++, type: d.type };
                scene.add(mesh);
                objects.push(mesh);
            });
            updateUI();
        }
        
        // تحميل عند البدء
        loadScene();

        // --- Resize & Loop ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        let fpsAcc = 0, frames = 0;

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            
            orbitControls.update();
            transformControls.update();
            renderer.render(scene, camera);

            // HUD
            fpsAcc += dt; frames++;
            if (fpsAcc >= 0.5) {
                document.getElementById('fps').textContent = Math.round(frames / fpsAcc);
                document.getElementById('dc').textContent = renderer.info.render.calls;
                fpsAcc = 0; frames = 0;
            }
        }

        animate();
        setActiveBtn(document.getElementById('btn-translate'));
    </script>
</body>
</html>
