<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="theme-color" content="#17191e">
    <title>KGTF ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1001">
</head>
<body>

<header id="header">
    <div class="brand">
        <div class="brand-name">KGTF</div>
        <div class="brand-subtitle">ENGINE</div>
    </div>

    <div class="header-tools">
        <button class="tool-btn" id="btn-add-cube" title="إضافة مكعب">مكعب</button>
        <button class="tool-btn" id="btn-add-character" title="إضافة شخصية">شخصية</button>
        <button class="tool-btn danger" id="btn-clear-scene" title="مسح المشهد">مسح</button>
        <button class="tool-btn" id="btn-save-scene" title="حفظ المشهد">حفظ</button>
        <button class="tool-btn" id="btn-load-scene" title="تحميل مشهد">فتح</button>
        <button class="tool-btn" id="btn-new-scene" title="إنشاء مشهد جديد">جديد</button>
        <input type="file" id="scene-file-input" accept=".json,application/json" hidden>
    </div>

    <button class="play-btn" id="btn-play">تشغيل</button>
</header>

<main id="viewport-container">
    <canvas id="viewport"></canvas>

    <div id="play-ui" style="display:none;">
        <div id="physics-debug" style="display:none;">
            <div class="debug-title">KGTF PHYSICS DEBUG</div>
            <div id="debug-world">World Bodies: --</div>
            <div id="debug-body">Player Body: --</div>
            <div id="debug-y">Player Y: --</div>
            <div id="debug-vy">Velocity Y: --</div>
            <div id="debug-move">Input: -- | Velocity: --</div>
        </div>

        <button id="exit-play">إيقاف اللعب</button>
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <button id="btn-jump">قفز</button>
    </div>
</main>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    }
}
</script>

<script type="module" src="src/main.js?v=1004"></script>
</body>
</html>
